# ==============================================================================
# Java HTTP Server Configuration
# ==============================================================================

# TCP port to bind and listen on (default: 8080)
server.port=8080

# IP address / interface to bind on (0.0.0.0 binds to all available interfaces)
server.host=0.0.0.0

# Number of worker threads in the fixed execution pool
server.threads=16

# Root directory for serving static web files
server.webroot=www

# Allow automatic HTML directory listing when index.html is missing (true/false)
server.directoryListing=true

# Socket read timeout in milliseconds (triggers 408 Request Timeout)
server.readTimeoutMs=10000

# Keep-alive timeout in milliseconds for idle persistent connections
server.keepAliveTimeoutMs=15000

# Maximum number of HTTP requests allowed on a single persistent keep-alive connection
server.maxRequestsPerConnection=100

# Maximum allowed Content-Length request body size in bytes (e.g. 10485760 = 10 MB)
server.maxBodySizeBytes=10485760

# Directory for storing uploaded files via POST /upload
server.uploadDir=www/uploads
